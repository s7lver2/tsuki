[package]
name        = "tsuki-webkit"
version     = "0.1.0"
edition     = "2021"
description = "tsuki-webkit — JSX→HTML/C++ compiler for ESP8266/ESP32 control panels"
license     = "MIT"
authors     = ["s7lver"]

[[bin]]
name = "tsuki-webkit"
path = "src/main.rs"

[lib]
name = "tsuki_webkit"
path = "src/lib.rs"

[dependencies]
thiserror  = "1.0"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"