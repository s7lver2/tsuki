name: CI Build
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
          - os: macos-latest
            platform: darwin-arm64  # Assuming macos-latest is arm64; adjust if needed
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
 
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'  # Matches the repo's Go version
 
      - name: Set up Rust
        uses: actions/setup-rust@v1  # Or use rust-lang/setup-rust
        with:
          rust-version: stable
 
      - name: Set up Node.js for Tauri
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Suitable for Tauri
 
      - name: Install dependencies
        run: |
          # Any additional deps if needed, e.g., for cross-compilation
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libclang-dev libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
          fi
          # Add for other OS if required by Tauri/Rust
 
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y
 
      - name: Build with build.py
        run: python build.py --platform ${{ matrix.platform }} --no-clean  # Use --no-clean to avoid cleaning in CI
 
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: releases/*  # Assuming packages are in releases/ as per build.py
